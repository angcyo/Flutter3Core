name: flutter3_onnx
description: "A Flutter ONNX Runtime Package."
version: 0.0.1
homepage: https://github.com/angcyo/Flutter3Core
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ^3.12.2

# https://dart.dev/tools/pub/workspaces/
# Support for pub workspaces was introduced in Dart 3.6.0.
resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  flutter3_basics:
    path: ../flutter3_basics

  # https://pub.dev/packages/image
  # https://pub.dev/packages/archive
  # https://pub.dev/packages/meta
  # https://pub.dev/packages/xml
  image: ^4.9.1

  # https://onnxruntime.ai/
  # https://github.com/microsoft/onnxruntime
  # ONNX Runtime v1.28.0

  # https://pub.dev/packages/flutter_onnxruntime
  # Current supported ONNX Runtime version: 1.23.0
  # https://pub.dev/packages/path_provider
  # platform :osx, '14.0'
  # [!] The 'Pods-Runner' target has transitive dependencies that include statically linked binaries: (onnxruntime-objc and onnxruntime-c) -> use_frameworks! :linkage => :static
  # Minimum OS Requirements / 最小支持系统版本
  # Min iOS is 16.0
  # Min macOS is 14
  # 需要配置:
  # - https://pub.dev/packages/flutter_onnxruntime#android
  # `1.8.3` birefnet 模型在macos上加载会报错
  flutter_onnxruntime: 1.8.0
  # https://pub.dev/packages/onnxruntime_plus
  # Updated to OnnxRuntime 1.22
  # Minimum OS Requirements / 最小支持系统版本
  # Min Android API level 24+
  #onnxruntime_plus: ^1.5.0

  # https://pub.dev/packages/onnxruntime_v2
  # Updated to OnnxRuntime 1.22
  # https://pub.dev/packages/onnxruntime
  # Minimum OS Requirements / 最小支持系统版本
  # Min Android API level 21+
  #onnxruntime_v2: ^1.23.2+2

  # https://pub.dev/packages/onnx_runtime_dart
  # 一个体积小、依赖项少的纯 Dart ONNX 推理运行时 。
  #onnx_runtime_dart: ^0.10.3

  # https://pub.dev/packages/betto_onnxrt
  # Minimum OS Requirements / 最小支持系统版本
  # Android 需要 minSdkVersion 35
  # 捆绑 ONNX Runtime v1.22.0 。
  #betto_onnxrt: ^0.1.0-dev.1
  #betto_onnxrt_ios: ^0.1.0-dev.1

  # https://pub.dev/packages/dart_onnx
  # dart_onnx 包使用 Dart FFI 绑定到 ONNX Runtime C 库 ( libonnxruntime )。运行模型之前，您必须在系统上安装 ONNX Runtime 动态库。
  #dart_onnx: ^0.1.1

  # https://pub.dev/packages/dort
  # https://github.com/pykeio/ort
  # 用于 Dart 的 ONNX 运行时 ( ort )。需要 Rust 工具链 ( rustup )。
  #dort: ^0.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

